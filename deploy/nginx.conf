server {
    listen 443 ssl;
    server_name 185.183.157.185;
    ssl_certificate /etc/debate-bot/webhook.pem;
    ssl_certificate_key /etc/debate-bot/webhook.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    location = /telegram {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
    }
    location = / {
        proxy_pass http://127.0.0.1:3000;
    }
    location / { return 404; }
}
